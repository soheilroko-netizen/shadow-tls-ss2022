<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dakal-tls</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <div id="bg" class="bg-full"></div>

  <!-- Top Bar -->
  <header class="top-bar">
    <!-- Split tunnel indicator -->
    <div class="split-indicator" id="split-indicator" title="Split Tunnel Status">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
        <path d="M6 4v6a4 4 0 004 4h4a4 4 0 014 4v2" />
        <path d="M18 4v6a4 4 0 01-4 4H10a4 4 0 00-4 4v2" />
        <path d="M9 4l-3 3-3-3M21 4l-3 3-3-3" />
      </svg>
    </div>

    <!-- App name centered -->
    <div class="app-title">dakal-tls</div>

    <!-- Hamburger menu → settings -->
    <button class="menu-btn" id="menu-btn" title="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
  </header>

  <!-- Main Content -->
  <main id="main" class="main-content">
    <!-- Power Button -->
    <div class="power-section" id="power-section">
      <div class="power-ring" id="power-ring">
        <button class="power-btn" id="btn-connect">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="28" height="28">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 4v8"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Status + Timer -->
    <div class="status-section" id="status-section">
      <div class="status-badge" id="status-badge">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Disconnected</span>
      </div>
      <div class="timer" id="timer">00:00:00</div>
    </div>

    <!-- Profile Selector -->
    <div class="profile-selector" id="profile-selector">
      <div class="profile-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>
        </svg>
      </div>
      <span class="profile-name" id="active-profile-name">Germany 1</span>
      <svg class="profile-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
      <div class="profile-dropdown" id="profile-dropdown"></div>
    </div>

    <!-- Data + Ping Row -->
    <div class="stats-row">
      <!-- Data Usage -->
      <div class="stat-card">
        <div class="stat-card-label">DATA</div>
        <div class="stat-card-value" id="stat-traffic">↺ 0B · 0B</div>
      </div>
      <!-- Ping -->
      <div class="stat-card">
        <div class="stat-card-label">PING</div>
        <div class="stat-card-value" id="ping-value">— ms</div>
      </div>
    </div>

    <!-- Reserved empty area for future features -->
    <div class="future-area" id="future-area"></div>
  </main>

  <script type="module" src="src/main.ts"></script>
</body>
</html>
