<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dakal-tls</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <div id="bg" class="bg-full"></div>

  <aside id="sidebar" class="sidebar">
    <div class="sidebar-inner">
      <div class="profile-card" id="sidebar-profile">
        <div class="avatar">G</div>
        <div class="profile-info">
          <div class="profile-name">Gaming</div>
          <div class="profile-label">Active Profile</div>
        </div>
        <div class="profile-arrow">▾</div>
      </div>

      <nav class="nav">
        <div class="nav-item active" data-view="dashboard" id="nav-dashboard">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor"><path d="M3 3h6v8H3V3zm0 10h6v4H3v-4zm8-10h6v4h-6V3zm0 6h6v8h-6V9z"/></svg>
          <span>Dashboard</span>
        </div>
        <div class="nav-item" data-view="profile-settings" id="nav-profile-settings">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor"><path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/><path fill-rule="evenodd" d="M10 2a8 8 0 100 16 8 8 0 000-16z"/></svg>
          <span>Profile Settings</span>
        </div>
        <div class="nav-item" data-view="app-settings" id="nav-app-settings">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor"><path d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z"/></svg>
          <span>App Settings</span>
        </div>
        <div class="nav-item" data-view="split-tunnel" id="nav-split-tunnel">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor"><path d="M2 10a8 8 0 1116 0 8 8 0 01-16 0zm8-6a6 6 0 100 12 6 6 0 000-12z"/><path d="M10 6a1 1 0 011 1v3a1 1 0 01-1 1H7a1 1 0 110-2h2V7a1 1 0 011-1z"/></svg>
          <span>Split Tunnel</span>
        </div>
        <div class="nav-item" data-view="log" id="nav-log">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor"><path d="M4 4a2 2 0 012-2h8a2 2 0 012 2v12a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 1a1 1 0 011-1h6a1 1 0 011 1v1a1 1 0 01-1 1H7a1 1 0 01-1-1V5zm0 4a1 1 0 011-1h6a1 1 0 011 1v1a1 1 0 01-1 1H7a1 1 0 01-1-1V9zm0 4a1 1 0 011-1h6a1 1 0 011 1v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-1z"/></svg>
          <span>Log</span>
        </div>
      </nav>

      <div class="sidebar-footer">
        <span class="version">v7.0</span>
      </div>
    </div>
  </aside>

  <main id="main">
    <div class="top-bar">
      <div class="window-controls" id="window-controls">
        <button class="win-btn win-min" id="win-min">─</button>
        <button class="win-btn win-max" id="win-max">□</button>
        <button class="win-btn win-close" id="win-close">✕</button>
      </div>
      <div class="top-right-controls">
        <div class="server-select" id="server-select">
          <svg class="globe-icon" viewBox="0 0 20 20" fill="currentColor" width="14" height="14"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zM4.34 6.5A7 7 0 0012 16.93V14a2 2 0 00-2-2H8v-2a1 1 0 00-1-1H5V7.5c0-.48.18-.93.34-1zm8.56-1.16A2 2 0 0011 4h-2a2 2 0 00-2 2v1h4v2a1 1 0 001 1h1v.5h1.4A6.98 6.98 0 0017 10a7 7 0 00-3.1-4.66z"/></svg>
          <span id="server-name">Germany - Frankfurt</span>
          <svg class="chevron-down" viewBox="0 0 20 20" fill="currentColor" width="12" height="12"><path d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z"/></svg>
        </div>
        <button class="settings-btn" id="btn-settings-quick">
          <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16"><path d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z"/></svg>
        </button>
      </div>
    </div>

    <div class="view active" id="view-dashboard">
      <div class="planet-section">
        <div class="planet-container" id="planet-container">
          <img src="public/saturn.png" alt="Saturn" class="planet-img" id="planet-img">
          <div class="planet-glow"></div>
          <button class="planet-power-btn" id="btn-connect">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="32" height="32">
              <path d="M12 2v8m0 0a4 4 0 100 8 4 4 0 000-8zm-8 8a8 8 0 1116 0"/>
            </svg>
          </button>
          <div class="planet-ring-glow" id="planet-ring-glow"></div>
        </div>
        <div class="status-section">
          <div class="status-badge" id="status-badge">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">Disconnected</span>
          </div>
          <div class="server-location" id="server-location">—</div>
          <div class="timer" id="timer">00:00:00</div>
        </div>
      </div>

      <div class="ping-widget" id="ping-widget">
        <div class="ping-header">
          <span class="ping-label">PING</span>
          <span class="ping-tooltip">?</span>
        </div>
        <div class="ping-value" id="ping-value">—</div>
        <canvas class="ping-graph" id="ping-graph" width="160" height="40"></canvas>
      </div>

      <div class="bottom-bar">
        <div class="stat-item">
          <svg class="stat-icon" viewBox="0 0 20 20" fill="currentColor" width="14" height="14"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zM4.34 6.5A7 7 0 0012 16.93V14a2 2 0 00-2-2H8v-2a1 1 0 00-1-1H5V7.5c0-.48.18-.93.34-1zm8.56-1.16A2 2 0 0011 4h-2a2 2 0 00-2 2v1h4v2a1 1 0 001 1h1v.5h1.4A6.98 6.98 0 0017 10a7 7 0 00-3.1-4.66z"/></svg>
          <div class="stat-labels">
            <div class="stat-title">CURRENT SERVER</div>
            <div class="stat-value" id="stat-server">—</div>
          </div>
          <div class="signal-bars">
            <div class="bar b1"></div><div class="bar b2"></div><div class="bar b3"></div><div class="bar b4"></div><div class="bar b5"></div>
          </div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <svg class="stat-icon" viewBox="0 0 20 20" fill="currentColor" width="14" height="14"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z"/></svg>
          <div class="stat-labels">
            <div class="stat-title">CONNECTED TIME</div>
            <div class="stat-value" id="stat-time">00:00:00</div>
          </div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-item">
          <svg class="stat-icon" viewBox="0 0 20 20" fill="currentColor" width="14" height="14"><path d="M10 3a1 1 0 011 1v12a1 1 0 11-2 0V4a1 1 0 011-1z"/></svg>
          <div class="stat-labels">
            <div class="stat-title">DATA USAGE</div>
            <div class="stat-value" id="stat-traffic">↑ 0 B · ↓ 0 B</div>
          </div>
        </div>
      </div>
    </div>

    <div class="view" id="view-profile-settings">
      <div class="view-header">
        <button class="back-btn" data-view="dashboard">← Back</button>
        <h2>Profile Settings</h2>
      </div>
      <div class="settings-form">
        <div class="form-group">
          <label>Profile Name</label>
          <input type="text" id="profile-name-input" value="Gaming">
        </div>
        <div class="form-group">
          <label>Server Address</label>
          <input type="text" id="server-address" placeholder="127.0.0.1:9092">
        </div>
        <div class="form-group">
          <label>TUN Name</label>
          <input type="text" id="tun-name" placeholder="stls-tun">
        </div>
        <div class="form-group">
          <label>MTU</label>
          <input type="number" id="mtu" placeholder="1500">
        </div>
        <div class="form-group">
          <label>Auto Connect</label>
          <select id="auto-connect">
            <option value="true">Enabled</option>
            <option value="false">Disabled</option>
          </select>
        </div>
        <button class="btn-save" id="btn-save-profile">Save Profile</button>
      </div>
    </div>

    <div class="view" id="view-app-settings">
      <div class="view-header">
        <button class="back-btn" data-view="dashboard">← Back</button>
        <h2>App Settings</h2>
      </div>
      <div class="settings-form">
        <div class="form-group">
          <label>Language</label>
          <select id="language">
            <option value="en">English</option>
            <option value="fa">فارسی</option>
          </select>
        </div>
        <div class="form-group">
          <label>Auto-start on boot</label>
          <select id="auto-start">
            <option value="true">Enabled</option>
            <option value="false">Disabled</option>
          </select>
        </div>
        <div class="form-group">
          <label>Minimize to tray</label>
          <select id="minimize-tray">
            <option value="true">Enabled</option>
            <option value="false">Disabled</option>
          </select>
        </div>
        <div class="form-group">
          <label>Notification on connect</label>
          <select id="notif-connect">
            <option value="true">Enabled</option>
            <option value="false">Disabled</option>
          </select>
        </div>
        <div class="form-group">
          <label>Ping interval (seconds)</label>
          <input type="number" id="ping-interval" value="5">
        </div>
        <button class="btn-save" id="btn-save-app">Save Settings</button>
      </div>
    </div>

    <div class="view" id="view-split-tunnel">
      <div class="view-header">
        <button class="back-btn" data-view="dashboard">← Back</button>
        <h2>Split Tunnel</h2>
      </div>
      <div class="split-tunnel-panel">
        <div class="form-group">
          <label>Mode</label>
          <select id="split-mode">
            <option value="exclude">Exclude (bypass VPN)</option>
            <option value="include">Include (only VPN)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Process Names (one per line)</label>
          <textarea id="split-processes" rows="4" placeholder="chrome.exe&#10;firefox.exe"></textarea>
        </div>
        <div class="form-group">
          <label>Domain/IP Rules (one per line)</label>
          <textarea id="split-domains" rows="4" placeholder="example.com&#10;192.168.1.0/24"></textarea>
        </div>
        <button class="btn-save" id="btn-save-split">Save Rules</button>
      </div>
    </div>

    <div class="view" id="view-log">
      <div class="view-header">
        <button class="back-btn" data-view="dashboard">← Back</button>
        <h2>Connection Log</h2>
        <button class="btn-clear-log" id="btn-clear-log">Clear</button>
      </div>
      <div class="log-container" id="log-container">
        <div class="log-placeholder">No events yet.</div>
      </div>
    </div>
  </main>

  <script type="module" src="src/main.ts"></script>
</body>
</html>
