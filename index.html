<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'">
<title>dakal-tls</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e4e4ec;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;height:100vh;overflow:hidden}
#app{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:20px}
h1{font-size:22px;font-weight:700;color:#fbbf24;letter-spacing:2px;margin-bottom:10px}
.btn{width:100px;height:100px;border-radius:50%;border:2px solid rgba(255,255,255,0.1);background:linear-gradient(145deg,#1a1a26,#0e0e14);color:rgba(255,255,255,0.25);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s}
.btn:hover{border-color:rgba(245,158,11,0.3);color:#f59e0b;box-shadow:0 0 25px rgba(245,158,11,0.1)}
.btn.on{border-color:#f59e0b;color:#f59e0b;box-shadow:0 0 35px rgba(245,158,11,0.2)}
.stat{font-size:13px;color:rgba(255,255,255,0.5)}
.stat.on{color:#22c55e}
</style>
</head>
<body>
<div id="app">
  <h1>dakal-tls</h1>
  <button class="btn" id="powerBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="26" height="26"><circle cx="12" cy="12" r="9"/><path d="M12 4v8"/></svg></button>
  <div class="stat" id="statusText">Disconnected</div>
</div>
<script>
window.__TAURI__ = window.__TAURI__ || {};
const invoke = window.__TAURI__.invoke || (async () => null);
let connected = false;
const btn = document.getElementById('powerBtn');
const st = document.getElementById('statusText');
async function poll(){
  try{connected = await invoke('get_status')}catch(e){}
  btn.className = 'btn' + (connected?' on':'');
  st.className = 'stat' + (connected?' on':'');
  st.textContent = connected?'Connected':'Disconnected';
}
btn.onclick = async()=>{
  try{
    if(connected) await invoke('stop_proxy');
    else await invoke('start_proxy');
    connected=!connected;
    poll();
  }catch(e){}
};
setInterval(poll,2000);
poll();
</script>
</body>
</html>
