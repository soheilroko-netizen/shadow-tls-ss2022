<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dakal-tls</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app">

    <!-- SIDEBAR -->
    <aside id="sidebar">
      <div id="profile-card" class="profile-card">
        <div class="profile-avatar">🎮</div>
        <div class="profile-info">
          <select id="sidebar-profile-select" class="profile-select">
            <option value="Default">Default</option>
          </select>
          <span class="profile-label">Active Profile</span>
        </div>
      </div>

      <nav id="nav">
        <button class="nav-item active" data-view="main">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          Dashboard
        </button>
        <button class="nav-item" data-view="settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Profile Settings
        </button>
        <button class="nav-item" data-view="split-tunnel">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3v4h14V3"/><path d="M5 21v-4h14v4"/><path d="M5 7v10"/><path d="M19 7v10"/></svg>
          Split Tunnel
        </button>
        <button class="nav-item" data-view="log">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Log
        </button>
      </nav>

      <div id="sidebar-footer">
        <span class="version">dakal-tls v5</span>
      </div>
    </aside>

    <!-- MAIN VIEWPORT -->
    <main id="view-main" class="view active">
      <div id="stars"></div>
      <div id="nebula"></div>

      <div id="connection-center">
        <div id="planet-icon" class="planet">
          <div class="planet-ring"></div>
          <svg id="power-btn" class="power-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/>
          </svg>
        </div>
        <div id="status-badge" class="status-badge disconnected">
          <span class="status-dot"></span>
          <span id="status-text">Disconnected</span>
        </div>
        <div id="server-name">—</div>
        <div id="timer">00:00</div>
      </div>

      <div id="top-right">
        <div id="server-pill" class="pill">
          <span class="dot dot-blue"></span>
          <select id="server-profile-select" class="mini-select">
            <option>Default</option>
          </select>
        </div>
        <button id="btn-settings-quick" class="icon-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>

      <div id="ping-widget" class="widget">
        <div class="widget-label">PING</div>
        <div id="ping-value" class="widget-value">0 ms</div>
        <div id="ping-graph" class="ping-graph">
          <svg width="100%" height="30" viewBox="0 0 80 30">
            <polyline fill="none" stroke="#00e5ff" stroke-width="1.5" points="0,25 10,20 20,22 30,15 40,18 50,10 60,12 70,5 80,8"/>
          </svg>
        </div>
      </div>

      <div id="bottom-bar">
        <div class="metric">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <div>
            <span class="metric-label">CURRENT SERVER</span>
            <span id="bottom-server" class="metric-value">—</span>
          </div>
        </div>
        <div class="metric">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <div>
            <span class="metric-label">CONNECTED TIME</span>
            <span id="bottom-uptime" class="metric-value">00:00</span>
          </div>
        </div>
        <div class="metric">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          <div>
            <span class="metric-label">DATA USAGE</span>
            <span id="bottom-traffic" class="metric-value">↑ 0  ↓ 0</span>
          </div>
        </div>
      </div>
    </main>

    <!-- SETTINGS VIEW -->
    <div id="view-settings" class="view">
      <div class="view-header">
        <button class="back-btn" data-view="main">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <h2>Profile Settings</h2>
      </div>
      <div class="view-body">
        <div class="form-card">
          <div class="profile-manage">
            <select id="settings-profile-select" class="settings-select">
              <option value="Default">Default</option>
            </select>
            <button type="button" id="btn-new-profile" class="btn-sm">New</button>
            <button type="button" id="btn-delete-profile" class="btn-sm btn-danger">Delete</button>
          </div>
        </div>

        <form id="settings-form" class="form-card">
          <div class="form-group">
            <label for="server_address">Server Address</label>
            <input type="text" id="server_address" name="server_address" placeholder="ns.baft.uk" required />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="ss_port">SS Port</label>
              <input type="number" id="ss_port" name="ss_port" placeholder="8380" min="1" max="65535" required />
            </div>
            <div class="form-group">
              <label for="stls_port">STLS Port</label>
              <input type="number" id="stls_port" name="stls_port" placeholder="8553" min="1" max="65535" required />
            </div>
          </div>
          <div class="form-group">
            <label for="ss_password">SS Password</label>
            <input type="password" id="ss_password" name="ss_password" placeholder="tE+3/qlN/..." required />
          </div>
          <div class="form-group">
            <label for="stls_password">STLS Password</label>
            <input type="password" id="stls_password" name="stls_password" placeholder="y2lachetore" required />
          </div>
          <div class="form-group">
            <label for="stls_sni">SNI</label>
            <input type="text" id="stls_sni" name="stls_sni" placeholder="dl.google.com" required />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="socks5_port">SOCKS5 Port</label>
              <input type="number" id="socks5_port" name="socks5_port" placeholder="1080" min="1" max="65535" required />
            </div>
            <div class="form-group">
              <label for="mtu">MTU</label>
              <input type="number" id="mtu" name="mtu" placeholder="1500" min="1280" max="9000" />
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn-primary">Save</button>
          </div>
          <div id="settings-message" class="msg"></div>
        </form>
      </div>
    </div>

    <!-- SPLIT TUNNEL VIEW -->
    <div id="view-split-tunnel" class="view">
      <div class="view-header">
        <button class="back-btn" data-view="main"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
        <h2>Split Tunnel</h2>
      </div>
      <div class="view-body">
        <p class="hint">Domains matching these rules bypass the VPN tunnel.</p>
        <div class="form-card">
          <div class="form-group">
            <label for="split_rules_view">Rules (one per line)</label>
            <textarea id="split_rules_view" rows="8" placeholder="*.ir&#10;aparat.com&#10;divar.ir"></textarea>
          </div>
          <div class="form-actions">
            <button id="btn-split-save" class="btn-primary">Save</button>
          </div>
        </div>
        <div id="split-msg" class="msg"></div>
      </div>
    </div>

    <!-- LOG VIEW -->
    <div id="view-log" class="view">
      <div class="view-header">
        <button class="back-btn" data-view="main"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
        <h2>Log</h2>
        <button id="btn-refresh-log" class="btn-sm" style="margin-left:auto">Refresh</button>
      </div>
      <div class="view-body">
        <pre id="log-content"></pre>
      </div>
    </div>

  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
