<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>amameborne</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app">

    <!-- ═══ Main View ═══ -->
    <div id="v-main" class="view active">
      <header class="hdr">
        <h1>amameborne</h1>
        <span class="sub">ShadowTLS + Shadowsocks VPN</span>
      </header>

      <div class="bar">
        <select id="main-profile"></select>
        <button id="btn-settings" class="icon" title="Settings">⚙</button>
        <button id="btn-log" class="icon" title="Log">☰</button>
      </div>

      <div class="card status-card">
        <div class="dot" id="dot"></div>
        <span id="status-text">Disconnected</span>
      </div>

      <div class="card info-card">
        <div class="row"><span class="lbl">Server</span><span class="val" id="i-server">-</span></div>
        <div class="row"><span class="lbl">Ping</span><span class="val mono" id="i-ping">-</span></div>
        <div class="row"><span class="lbl">Uptime</span><span class="val" id="i-uptime">-</span></div>
        <div class="row"><span class="lbl">↑ Speed</span><span class="val mono" id="i-speed-up">0 B/s</span></div>
        <div class="row"><span class="lbl">↓ Speed</span><span class="val mono" id="i-speed-down">0 B/s</span></div>
        <div class="row"><span class="lbl">↑ Total</span><span class="val mono" id="i-total-up">0 B</span></div>
              <div class="row"><span class="lbl">↓ Total</span><span class="val mono" id="i-total-down">0 B</span></div>
              <div class="row last"><span class="lbl">↑ Speed</span><span class="val mono" id="i-speed-up">0 B/s</span></div>
              <div class="row"><span class="lbl">↓ Speed</span><span class="val mono" id="i-speed-down">0 B/s</span></div>
      </div>

      <div class="actions">
        <button id="btn-connect" class="btn primary">Connect</button>
        <button id="btn-disconnect" class="btn danger" disabled>Disconnect</button>
      </div>

      <div id="msg" class="msg"></div>
    </div>

    <!-- ═══ Settings View ═══ -->
    <div id="v-settings" class="view">
      <header class="hdr">
        <button id="back-settings" class="back">←</button>
        <h1>Settings</h1>
      </header>

      <div class="scroll">
        <div class="bar">
          <select id="settings-profile"></select>
          <button id="btn-new" class="pill">+ New</button>
          <button id="btn-del" class="pill warn">Delete</button>
        </div>

        <form id="settings-form">
          <div class="field"><label>Server Address</label><input id="f-server" required></div>
          <div class="field"><label>SS Port</label><input id="f-ss-port" type="number" min="1" max="65535" required></div>
          <div class="field"><label>SS Password</label><input id="f-ss-pass" type="password" required></div>
          <div class="field"><label>STLS Port</label><input id="f-stls-port" type="number" min="1" max="65535" required></div>
          <div class="field"><label>STLS Password</label><input id="f-stls-pass" type="password" required></div>
          <div class="field"><label>STLS SNI</label><input id="f-stls-sni" required></div>
          <div class="field"><label>SOCKS5 Port</label><input id="f-socks5" type="number" min="1" max="65535" required></div>
          <div class="field"><label>MTU <span class="dim">(empty = default)</span></label><input id="f-mtu" type="number" min="1280" max="9000"></div>
          <div class="field"><label>Split Tunneling <span class="dim">(direct routes, one/line)</span></label><textarea id="f-split" rows="3" placeholder="*.ir&#10;aparat.com&#10;*keyword*"></textarea></div>
          <div class="actions"><button type="submit" class="btn primary">Save</button></div>
        </form>
      </div>

      <div id="settings-msg" class="msg"></div>
    </div>

    <!-- ═══ Log View ═══ -->
    <div id="v-log" class="view">
      <header class="hdr">
        <button id="back-log" class="back">←</button>
        <h1>Log</h1>
        <button id="btn-refresh" class="pill">Refresh</button>
      </header>
      <pre id="log-content" class="logbox"></pre>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
