name: Build
on:
  push:
    branches: [main, v6]
  pull_request:
    branches: [main, v6]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cargo fetch
        run: cd src-tauri && cargo fetch

      - name: Download sing-box
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod "https://api.github.com/repos/SagerNet/sing-box/releases/latest" -Headers @{"User-Agent"="dakal-tls"}
          $tag = $rel.tag_name.TrimStart('v')
          $zip = "sing-box-$tag-windows-amd64.zip"
          $asset = $rel.assets | Where-Object { $_.name -eq $zip } | Select-Object -First 1
          if (-not $asset) { throw "Asset $zip not found" }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile sb.zip
          New-Item -ItemType Directory -Force src-tauri/bin | Out-Null
          tar -xf sb.zip -C src-tauri/bin --strip-components=1 "sing-box-$tag-windows-amd64/sing-box.exe"

      - name: npm install
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Tauri build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --verbose

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: dakal-tls-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
