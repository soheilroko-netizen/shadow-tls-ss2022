name: Build stls (WinTun TUN VPN)

on:
  push:
    branches: [v3, v4]
  pull_request:
    branches: [v3, v4]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 1. Download wintun.dll for TUN device support
      # ---------------------------------------------------------------
      - name: Download wintun.dll
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile "wintun.zip"
          Expand-Archive -Path "wintun.zip" -DestinationPath "wintun-staged" -Force
          Remove-Item "wintun.zip" -Force
          # Move wintun.dll to src-tauri/bin/ so Tauri bundles it
          New-Item -ItemType Directory -Force -Path "src-tauri\\bin" | Out-Null
          Move-Item "wintun-staged\\wintun\\bin\\amd64\\wintun.dll" "src-tauri\\bin\\wintun.dll" -Force
          Remove-Item -Recurse -Force "wintun-staged"
          Write-Host "wintun.dll ready at src-tauri\\bin\\wintun.dll"
          if (-not (Test-Path "src-tauri\\bin\\wintun.dll")) {
            throw "wintun.dll missing after move"
          }
          Get-Item "src-tauri\\bin\\wintun.dll" | Select-Object Name, Length, FullName

      # ---------------------------------------------------------------
      # 2. Frontend (pnpm + Vite)
      # ---------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@8

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      # ---------------------------------------------------------------
      # 3. Tauri build (Rust + NSIS + MSI). tauri-action picks up
      #    src-tauri/Cargo.toml, runs beforeBuildCommand (pnpm build),
      #    and bundles `resources: ["bin/sing-box.exe"]` into the
      #    installers automatically.
      # ---------------------------------------------------------------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri app (MSI + NSIS, with bundled wintun.dll)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri

      # ---------------------------------------------------------------
      # 4. Upload installer artifacts
      # ---------------------------------------------------------------
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stls-v2-windows
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: error
