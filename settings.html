<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dakal-tls Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="settings-container">
    <!-- Header -->
    <header class="settings-header">
      <h2>Settings</h2>
      <button class="close-btn" id="close-settings" title="Close">✕</button>
    </header>

    <!-- Tabs -->
    <div class="settings-tabs">
      <button class="tab-btn" data-tab="profile">Profile</button>
      <button class="tab-btn" data-tab="app">App</button>
      <button class="tab-btn" data-tab="split">Split Tunn</button>
    </div>

    <!-- Tab Content Sections -->
    <main class="settings-content">
      <!-- Profile Tab -->
      <section class="tab-panel" id="tab-profile">
        <div class="settings-form">
          <div class="section-title">Profile</div>
          <div class="form-row">
            <div class="form-group half">
              <label>Profile Name</label>
              <input type="text" id="profile-name-input" value="Germany 1">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group half">
              <label>Server</label>
              <input type="text" id="server-address" placeholder="ns.baft.uk">
            </div>
            <div class="form-group half">
              <label>Socks5 Port</label>
              <input type="number" id="socks5-port" value="1080">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group half">
              <label>SS Port</label>
              <input type="number" id="ss-port" value="8380">
            </div>
            <div class="form-group half">
              <label>SS Password</label>
              <input type="password" id="ss-password" placeholder="">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group half">
              <label>STLS Port</label>
              <input type="number" id="stls-port" value="8553">
            </div>
            <div class="form-group half">
              <label>STLS Password</label>
              <input type="password" id="stls-password" placeholder="">
            </div>
          </div>
          <div class="form-group">
            <label>STLS SNI</label>
            <input type="text" id="stls-sni" value="dl.google.com">
          </div>
          <div class="form-row">
            <div class="form-group half">
              <label>MTU</label>
              <input type="number" id="mtu" placeholder="1500">
            </div>
            <div class="form-group half">
              <label>Encryption</label>
              <select id="encryption-method">
                <option value="aes-256-gcm">AES-256-GCM</option>
                <option value="chacha20-ietf-poly1305">ChaCha20-Poly1305</option>
                <option value="aes-128-gcm">AES-128-GCM</option>
                <option value="2022-blake3-aes-256-gcm">2022-Blake3-AES-256-GCM</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Auto Connect</label>
            <select id="auto-connect">
              <option value="true">Enabled</option>
              <option value="false" selected>Disabled</option>
            </select>
          </div>
          <div class="form-actions">
            <button class="btn-save" id="btn-save-profile">Save</button>
            <button class="btn-add" id="btn-add-profile">Create Profile</button>
            <button class="btn-delete" id="btn-delete-profile">Delete</button>
          </div>
        </div>
      </section>

      <!-- App Tab -->
      <section class="tab-panel" id="tab-app">
        <div class="settings-form">
          <div class="section-title">Application</div>
          <div class="form-group">
            <label>Language</label>
            <select id="language">
              <option value="en">English</option>
              <option value="fa">فارسی</option>
            </select>
          </div>
          <div class="form-group">
            <label>Auto-start on boot</label>
            <select id="auto-start">
              <option value="true">Enabled</option>
              <option value="false" selected>Disabled</option>
            </select>
          </div>
          <div class="form-group">
            <label>Minimize to tray</label>
            <select id="minimize-tray">
              <option value="true">Enabled</option>
              <option value="false" selected>Disabled</option>
            </select>
          </div>
          <div class="form-group">
            <label>Notification on connect</label>
            <select id="notif-connect">
              <option value="true">Enabled</option>
              <option value="false" selected>Disabled</option>
            </select>
          </div>
          <div class="form-group">
            <label>Ping interval (seconds)</label>
            <input type="number" id="ping-interval" value="1" min="1" max="60">
          </div>
          <button class="btn-save" id="btn-save-app">Save</button>
        </div>
      </section>

      <!-- Split Tunnel Tab -->
      <section class="tab-panel" id="tab-split">
        <div class="settings-form split">
          <div class="section-title">Split Tunnel</div>
          <div class="form-group">
            <label>Mode</label>
            <select id="split-mode">
              <option value="exclude">Exclude (bypass VPN)</option>
              <option value="include">Include (only VPN)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Process Names (one per line)</label>
            <textarea id="split-processes" rows=4 placeholder="chrome.exe\nfirefox.exe"></textarea>
          </div>
          <div class="form-group">
            <label>Domain/IP Rules (one per line)</label>
            <textarea id="split-domains" rows=4 placeholder="example.com\n192.168.1.0/24"></textarea>
          </div>
          <button class="btn-save" id="btn-save-split">Save Rules</button>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="settings.ts"></script>
</body>
</html>
