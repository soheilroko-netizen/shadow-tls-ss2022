<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <!-- Planet gradient -->
    <radialGradient id="planetGrad" cx="40%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#f5e6c8"/>
      <stop offset="20%" stop-color="#e8d5a3"/>
      <stop offset="40%" stop-color="#d4b87a"/>
      <stop offset="55%" stop-color="#c4a05a"/>
      <stop offset="70%" stop-color="#b08a50"/>
      <stop offset="85%" stop-color="#8a6a3a"/>
      <stop offset="100%" stop-color="#5a4020"/>
    </radialGradient>
    <!-- Ring gradient -->
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(200,180,140,0.1)"/>
      <stop offset="15%" stop-color="rgba(210,190,150,0.6)"/>
      <stop offset="30%" stop-color="rgba(220,200,160,0.8)"/>
      <stop offset="45%" stop-color="rgba(200,180,140,0.3)"/>
      <stop offset="50%" stop-color="rgba(180,160,120,0.1)"/>
      <stop offset="55%" stop-color="rgba(200,180,140,0.3)"/>
      <stop offset="70%" stop-color="rgba(220,200,160,0.8)"/>
      <stop offset="85%" stop-color="rgba(210,190,150,0.6)"/>
      <stop offset="100%" stop-color="rgba(200,180,140,0.1)"/>
    </linearGradient>
    <!-- Planet shadow -->
    <radialGradient id="shadowGrad" cx="70%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="60%" stop-color="rgba(0,0,0,0.1)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.5)"/>
    </radialGradient>
    <!-- Atmosphere glow -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="rgba(80,120,200,0.08)"/>
      <stop offset="100%" stop-color="rgba(80,120,200,0)"/>
    </radialGradient>
    <!-- Ring shadow on planet -->
    <linearGradient id="ringShadowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="35%" stop-color="rgba(0,0,0,0.2)"/>
      <stop offset="50%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </linearGradient>
  </defs>

  <!-- Planet glow -->
  <circle cx="250" cy="255" r="160" fill="url(#glowGrad)"/>

  <!-- Back half of rings -->
  <ellipse cx="250" cy="250" rx="225" ry="65" fill="none" stroke="url(#ringGrad)" stroke-width="28" transform="rotate(-15 250 250)" opacity="0.9"/>
  <ellipse cx="250" cy="250" rx="205" ry="55" fill="none" stroke="rgba(200,180,140,0.2)" stroke-width="8" transform="rotate(-15 250 250)"/>
  <ellipse cx="250" cy="250" rx="240" ry="70" fill="none" stroke="rgba(200,180,140,0.15)" stroke-width="4" transform="rotate(-15 250 250)"/>

  <!-- Planet body -->
  <!-- Atmosphere -->
  <circle cx="250" cy="250" r="105" fill="none" stroke="rgba(120,160,220,0.15)" stroke-width="6"/>
  <!-- Base planet -->
  <circle cx="250" cy="250" r="100" fill="url(#planetGrad)"/>
  <!-- Planet bands -->
  <ellipse cx="250" cy="220" rx="100" ry="12" fill="rgba(200,170,120,0.15)"/>
  <ellipse cx="250" cy="240" rx="100" ry="8" fill="rgba(180,150,100,0.12)"/>
  <ellipse cx="250" cy="265" rx="100" ry="10" fill="rgba(210,180,130,0.1)"/>
  <ellipse cx="250" cy="285" rx="100" ry="7" fill="rgba(170,140,90,0.15)"/>
  <!-- Shadow on planet -->
  <circle cx="250" cy="250" r="100" fill="url(#shadowGrad)"/>
  <!-- Ring shadow across planet -->
  <ellipse cx="250" cy="250" rx="100" ry="8" fill="rgba(0,0,0,0.2)" transform="rotate(-15 250 250)"/>

  <!-- Front half of rings -->
  <clipPath id="ringClip">
    <rect x="0" y="250" width="500" height="250"/>
  </clipPath>
  <g clip-path="url(#ringClip)">
    <ellipse cx="250" cy="250" rx="225" ry="65" fill="none" stroke="url(#ringGrad)" stroke-width="28" transform="rotate(-15 250 250)" opacity="0.9"/>
    <ellipse cx="250" cy="250" rx="205" ry="55" fill="none" stroke="rgba(210,190,150,0.35)" stroke-width="8" transform="rotate(-15 250 250)"/>
    <ellipse cx="250" cy="250" rx="240" ry="70" fill="none" stroke="rgba(210,190,150,0.2)" stroke-width="4" transform="rotate(-15 250 250)"/>
  </g>

  <!-- Highlight / shine on planet -->
  <ellipse cx="225" cy="225" rx="35" ry="25" fill="rgba(255,255,255,0.08)" transform="rotate(-20 225 225)"/>
  <ellipse cx="215" cy="215" rx="15" ry="10" fill="rgba(255,255,255,0.12)" transform="rotate(-20 215 215)"/>
</svg>